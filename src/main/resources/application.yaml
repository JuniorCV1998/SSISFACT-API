spring:
  application:
    name: ssisfact-api
  datasource:
    url: jdbc:mysql://localhost:3306/db_ssimple_ssifact?serverTimezone=America/Lima
    username: root
    password: admin
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        proc:
          param_null_passing: true

# JWT Configuration
jwt:
  secret: ssisfact-api-jwt-secret-key-2026-must-be-at-least-256-bits-long-for-hs256
  expiration: 86400000  # 24 hours in milliseconds

# Integración con el bot de automatización SUNAT
sunat:
  bot:
    base-url: http://localhost:3000
    # irABuzon/irABuzonMensajes ya no bloquean una sola llamada HTTP larga:
    # usan job+polling, así que esto solo aplica a cada llamada individual
    # (login, iniciar job, cada poll), que son rápidas.
    timeout-ms: 15000
    job:
      poll-interval-ms: 3000   # cada cuánto se consulta el estado del job
      max-wait-ms: 600000      # 10 min: tope total esperando un job (buzones grandes)
  cache:
    ttl-seconds: 1800  # 30 minutos
  crypto:
    # AES-256, 32 bytes en Base64. Cambiar por variable de entorno en producción.
    secret-key: ${SUNAT_CRYPTO_KEY:m4ovYQsnFXm2edm4FsbTZ2Yx06bjt0q5ZjC+ufCd56A=}

# Consulta de DNI/RUC (Decolecta) — caché local en cliente_documento
decolecta:
  base-url: ${DECOLECTA_BASE_URL:https://api.decolecta.com/v1}
  token: ${DECOLECTA_TOKEN:sk_3893.TKjkyKhUYJ16KK9bqSbyD6e4URMaDVSS}
  timeout-ms: 10000
